name: selenium-bdd

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/selenium-bdd

    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run suite headless
        run: mvn -B -Dheadless=true -Dbrowser=chrome test

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selenium-reports
          if-no-files-found: ignore
          path: |
            projects/selenium-bdd/target/surefire-reports
            projects/selenium-bdd/target/cucumber-reports
            projects/selenium-bdd/target/extent-reports
            projects/selenium-bdd/target/screenshots
