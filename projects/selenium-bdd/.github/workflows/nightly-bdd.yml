name: Nightly Selenium BDD

on:
  schedule:
    # Every night at 06:00 UTC (~2:00 AM ET)
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  nightly-tests:
    name: Run BDD suite and email reports
    runs-on: ubuntu-latest
    # Always produce/email reports even when tests fail
    continue-on-error: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Install Google Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Run Selenium BDD tests (headless)
        id: tests
        continue-on-error: true
        run: mvn -B clean test -Dheadless=true -Dbrowser=chrome

      - name: Summarize results
        id: summary
        if: always()
        run: |
          if [ "${{ steps.tests.outcome }}" = "success" ]; then
            echo "status=PASSED" >> "$GITHUB_OUTPUT"
            echo "emoji=✅" >> "$GITHUB_OUTPUT"
          else
            echo "status=FAILED" >> "$GITHUB_OUTPUT"
            echo "emoji=❌" >> "$GITHUB_OUTPUT"
          fi
          {
            echo "### Nightly Selenium BDD"
            echo ""
            echo "- **Result:** ${{ steps.tests.outcome }}"
            echo "- **Branch:** ${{ github.ref_name }}"
            echo "- **Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Cucumber report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-report
          path: target/cucumber-reports/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Extent report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extent-report
          path: target/extent-reports/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: failure-screenshots
          path: target/screenshots/
          if-no-files-found: ignore
          retention-days: 14

      - name: Package reports for email
        if: always()
        run: |
          mkdir -p email-attachments
          if [ -f target/cucumber-reports/cucumber.html ]; then
            cp target/cucumber-reports/cucumber.html email-attachments/
          fi
          if [ -f target/extent-reports/SparkReport.html ]; then
            cp target/extent-reports/SparkReport.html email-attachments/
          fi
          if [ -d target/screenshots ] && [ "$(ls -A target/screenshots 2>/dev/null)" ]; then
            cp target/screenshots/*.png email-attachments/ 2>/dev/null || true
          fi
          cd email-attachments && zip -r ../test-reports.zip . && cd ..
          ls -la email-attachments test-reports.zip || true

      - name: Email reports
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "${{ steps.summary.outputs.emoji }} Nightly Selenium BDD — ${{ steps.summary.outputs.status }} (${{ github.repository }})"
          to: ${{ secrets.MAIL_TO }}
          from: ${{ secrets.MAIL_FROM }}
          body: |
            Nightly Selenium BDD run finished.

            Status: ${{ steps.summary.outputs.status }}
            Repository: ${{ github.repository }}
            Branch: ${{ github.ref_name }}
            Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Attached: Cucumber HTML, Extent Spark report, and any failure screenshots (ZIP).
            Artifacts are also available on the Actions run page for 14 days.
          attachments: test-reports.zip
          ignore_cert: false

      - name: Fail job if tests failed
        if: steps.tests.outcome != 'success'
        run: |
          echo "Tests failed — failing the workflow after reports were emailed."
          exit 1
